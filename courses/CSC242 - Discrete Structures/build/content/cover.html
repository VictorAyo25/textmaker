    <div class="motif">
      <!-- The motif is the course itself: a small graph (vertices and edges),
           a truth table, and set notation. Every mark here is a real object the
           book goes on to teach, not decoration. -->
      <svg viewBox="0 0 520 210" xmlns="http://www.w3.org/2000/svg">
        <!-- a labelled graph on five vertices -->
        <g stroke="#7f88d6" stroke-width="1.5" opacity=".85">
          <line x1="40" y1="122" x2="106" y2="46"/>
          <line x1="40" y1="122" x2="118" y2="150"/>
          <line x1="106" y1="46" x2="118" y2="150"/>
          <line x1="106" y1="46" x2="186" y2="80"/>
          <line x1="118" y1="150" x2="186" y2="80"/>
          <line x1="186" y1="80" x2="196" y2="164"/>
          <line x1="118" y1="150" x2="196" y2="164"/>
        </g>
        <g fill="#f2778f">
          <circle cx="40" cy="122" r="7.5"/>
          <circle cx="106" cy="46" r="7.5"/>
          <circle cx="118" cy="150" r="7.5"/>
          <circle cx="186" cy="80" r="7.5"/>
          <circle cx="196" cy="164" r="7.5"/>
        </g>
        <g font-family="DejaVu Sans" font-size="11" fill="#c8cdf0">
          <text x="24" y="112">a</text>
          <text x="98" y="36">b</text>
          <text x="110" y="172">c</text>
          <text x="194" y="72">d</text>
          <text x="204" y="182">e</text>
        </g>

        <!-- a truth table for implication -->
        <g font-family="DejaVu Sans Mono" font-size="13">
          <text x="272" y="34" fill="#9aa3e0">p</text>
          <text x="302" y="34" fill="#9aa3e0">q</text>
          <text x="342" y="34" fill="#9aa3e0">p &#8594; q</text>
          <g fill="#dbe0f6">
            <text x="272" y="58">T</text><text x="302" y="58">T</text><text x="360" y="58">T</text>
            <text x="272" y="78">T</text><text x="302" y="78">F</text><text x="360" y="78">F</text>
            <text x="272" y="98">F</text><text x="302" y="98">T</text><text x="360" y="98">T</text>
            <text x="272" y="118">F</text><text x="302" y="118">F</text><text x="360" y="118">T</text>

        </g>
        <line x1="270" y1="42" x2="410" y2="42" stroke="#5560a8" stroke-width="1.2"/>

        <!-- set notation -->
        <rect x="0" y="188" width="520" height="1.4" fill="#5560a8" opacity=".6"/>
        <g font-family="DejaVu Sans" font-size="13" fill="#aeb6e8">
          <text x="272" y="150">A &#8746; B</text>
          <text x="340" y="150">A &#8745; B</text>
          <text x="408" y="150">A &#8838; B</text>
          <text x="272" y="172">n(A &#8746; B) = n(A) + n(B) &#8722; n(A &#8745; B)</text>
        </g>
      </svg>
    </div>
